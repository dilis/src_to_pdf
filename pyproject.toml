[project]
name = "src-to-pdf"
version = "0.1.0"
description = "Render every file in a project directory into a single syntax-highlighted PDF."
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "pygments>=2.17",
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
to-pdf = "to_pdf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["to_pdf.py", "project_meta.py"]
